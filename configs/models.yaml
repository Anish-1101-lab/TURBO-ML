# Model configuration for the hidden-state acceptance probe project.
#
# Target and drafter are deliberately independent checkpoints (different
# param counts, both separately pretrained+instruction-tuned) sharing a
# tokenizer family, so no vocab remapping is needed for the SD accept/reject
# rule. See PROGRESS.md "Design decisions" for the EAGLE-vs-independent-LM
# rationale.

target:
  name: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  revision: main

drafter:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  revision: main

device:
  cuda_visible_devices: "1"   # pinned idle GPU index on the H200 node, checked via nvidia-smi before each session
                                # (moved from GPU 1 -> GPU 4 for Phase 4: GPU 1 was occupied then;
                                #  moved GPU 4 -> GPU 1 for Phase 4c: another tenant's job took over
                                #  GPUs 4-7 entirely (100% util, 118-136GB each) between Phase 5 and
                                #  Phase 4c sessions -- GPUs 0-2 were lightly used (~1.2GB, 11-16% util)
                                #  by comparison, GPU 1 lowest of those three at check time)

seed: 0
